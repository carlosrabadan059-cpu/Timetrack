# Cabeceras de seguridad del frontend (security-audit.md CN-002, #35).
# Se incluye en cada location: en nginx, un add_header dentro de un location anula los del server.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
# Orígenes externos que usa la app:
#   api.rabadanhouse.space (backend y SSE) · *.supabase.co (Auth)
#   fonts.googleapis.com / fonts.gstatic.com (fuente Inter, index.html)
#   unpkg.com (iconos del marcador de Leaflet) · *.tile.openstreetmap.org (mapa de sucursales)
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.rabadanhouse.space https://*.supabase.co wss://*.supabase.co; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://unpkg.com https://*.tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
